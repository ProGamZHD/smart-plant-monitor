<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Plant Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
    .subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 40px; }
    .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .card {
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      min-width: 180px;
    }
    .card .label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
    .card .value { font-size: 3rem; font-weight: 700; line-height: 1; }
    .card .unit  { font-size: 1.2rem; color: #94a3b8; margin-top: 4px; }
    .temp  .value { color: #f6ad55; }
    .humid .value { color: #63b3ed; }
    .status {
      margin-top: 32px;
      font-size: 0.8rem;
      color: #4a5568;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #48bb78;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <h1>🌿 Smart Plant Monitor</h1>
  <p class="subtitle">Live sensor data — updates every 5 seconds</p>

  <div class="cards">
    <div class="card temp">
      <div class="label">Temperature</div>
      <div class="value" id="temp">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card humid">
      <div class="label">Humidity</div>
      <div class="value" id="humidity">--</div>
      <div class="unit">%</div>
    </div>
  </div>

  <p class="status">
    <span class="dot"></span>
    Last updated: <span id="last-updated">loading...</span>
  </p>

  <script>
    const API_URL = 'https://ysxbsbrjwe.execute-api.ap-southeast-1.amazonaws.com/sensor';

    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        document.getElementById('temp').textContent = data.temperature.toFixed(1);
        document.getElementById('humidity').textContent = data.humidity.toFixed(1);
        document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById('last-updated').textContent = 'Connection error';
      }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
