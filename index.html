/* ===== user layout & style overrides ===== */
.status-bar{justify-content:space-between;gap:8px}
.status-bar>div,.status-bar>span{flex:1 1 0;min-width:0;justify-content:center;text-align:center}
.status-bar .status-updated{margin-left:0;display:flex;align-items:center;justify-content:center}
.dash-grid{grid-template-columns:minmax(0,1.5fr) minmax(320px,1.02fr);gap:14px;align-items:stretch}
.dash-section{margin:16px 0}
.pmv-hero{padding:20px}
.pmv-stage{min-height:206px}
.pump-btn{background:linear-gradient(135deg,#52b788,#2d6a4f);box-shadow:0 10px 26px -10px rgba(45,106,79,.55);color:#eafff2}
.pump-btn.pumping{background:linear-gradient(135deg,#6ee7a6,#34d399);color:#06140d}
.pump-btn:disabled{cursor:not-allowed;opacity:.7;filter:none}
.cooldown-bar{background:linear-gradient(90deg,#f6ad55,#ed8936)}
.pmv-thumb{box-shadow:0 0 20px -5px rgba(var(--tc-rgb,110 231 166),var(--glow-a,0))}
.pmv-thumb.active{box-shadow:0 0 0 1px rgba(var(--tc-rgb,110 231 166),.6),0 12px 30px -12px rgba(var(--tc-rgb,110 231 166),calc(var(--glow-a,.4) + .2))}
.cam-card-dot.standby{background:#f6ad55;animation:pulse 1.4s infinite}
.pump-auto.on{color:#06140d;background:var(--leaf);display:inline-flex;align-items:center;gap:6px}
.pump-auto.on::before{content:"";width:7px;height:7px;border-radius:50%;background:#06321f;display:inline-block;animation:pulse 1.6s infinite}
/* ===== v2 overrides ===== */
.status-bar{margin:12px 0 18px}
.pmv-thumb{border:1px solid transparent;background:#ffffff0a}
.pmv-thumb.active{border:1px solid transparent}
.dash-grid{grid-template-columns:minmax(0,2.15fr) minmax(0,.74fr);gap:14px;align-items:start}
.dash-hero-wrap{display:block}
.dash-hero-wrap>.pmv-hero{display:block;flex:none}
.dash-hero-wrap .pmv-stage{flex:none;min-height:200px}
.cam-water-col{gap:12px}
.cam-water-col .cam-card-art{min-height:118px}
.dash-section{margin:14px 0}
.dash-grid .cam-water-col .cam-card{text-align:left}
.dash-grid .cam-water-col .cam-card .bento-head{justify-content:flex-start}
.dash-grid .cam-water-col .cam-card .cam-card-meta{align-items:flex-start;text-align:left}
.dash-grid .cam-water-col .cam-card .cam-card-statusrow{justify-content:flex-start}
.dash-grid .cam-water-col .cam-card .cam-open-hint{align-self:flex-start;text-align:left}
.pump-auto .pa-sub{opacity:.62;font-weight:600;margin-left:2px}
.pump-auto.on .pa-sub{color:#06321f}

/* ===== v3 overrides ===== */
.pmv-thumb{border:1px solid var(--line)}
.pmv-thumb.active{border-color:rgba(110,231,166,.55)}
.status-bar>div,.status-bar>span{border:0 !important;background:transparent !important;box-shadow:none !important}
.status-bar .live-badge,.status-bar .ws-badge{border:0 !important;background:transparent !important}
.dash-grid{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr) !important;gap:16px !important;align-items:stretch !important;margin-bottom:8px !important}
.dash-hero-wrap{display:flex !important}
.dash-hero-wrap>.pmv-hero{display:flex !important;flex-direction:column !important;flex:1 !important}
.dash-hero-wrap .pmv-stage{flex:1 1 auto !important;min-height:200px !important}
.cam-water-col{display:flex !important;flex-direction:column !important;gap:16px !important}
.cam-water-col .cam-card{flex:1 !important}
.cam-water-col .cam-card-art{flex:1 !important;min-height:160px !important}
.cam-health-strip{margin:8px 0 14px !important}
.dash-grid .cam-water-col .cam-card{align-items:flex-start !important;text-align:left !important}
.dash-grid .cam-water-col .cam-card .bento-head{justify-content:flex-start !important;width:100%}
.dash-grid .cam-water-col .cam-card .cam-card-meta{align-items:flex-start !important;text-align:left !important}
.dash-grid .cam-water-col .cam-card .cam-card-statusrow{justify-content:flex-start !important}
.dash-grid .cam-water-col .cam-card .cam-open-hint{align-self:flex-start !important;text-align:left !important}
.cam-water-col .bento-card.span2,.cam-water-col .pump-card{padding:20px !important}
.cooldown-track{margin-top:10px}
.tables-grid{margin-top:14px !important}

    animation:spmOlderIndexPulseV14 2s infinite !important;
    -webkit-animation:spmOlderIndexPulseV14 2s infinite !important;
    transform:none !important;
    box-shadow:none !important;
  }
}
@media only screen and (max-width:430px){
  .history-section .table-wrapper,
  .pump-history-section .table-wrapper{
    width:calc(100vw - 2 * clamp(18px,3vw,34px)) !important;
    max-width:calc(100vw - 2 * clamp(18px,3vw,34px)) !important;
    margin-left:calc(50% - 50vw + 26px) !important;
  }
}
</style>

<style id="mobile-width-v15">
/* v15: hard-match admin + history table card width to the same mobile module width as mood/chart cards. */
@media only screen and (max-width: 820px){
  /* Use the same inset as the main mobile cards. */
  :root{--spm-standard-card-w:calc(100vw - 52px);--spm-standard-card-left:26px;}

  .main,.page,.page-dashboard,.dash-section,.tables-grid,.history-section,.pump-history-section{
    max-width:100vw !important;
    overflow:visible !important;
    box-sizing:border-box !important;
  }

  /* Admin module: same left/right edge as Current Mood / sensor modules. */
  .admin-bar{
    position:relative !important;
    left:calc(50% - 50vw + var(--spm-standard-card-left)) !important;
    right:auto !important;
    width:var(--spm-standard-card-w) !important;
    max-width:var(--spm-standard-card-w) !important;
    min-width:var(--spm-standard-card-w) !important;
    margin:8px 0 10px 0 !important;
    transform:none !important;
    box-sizing:border-box !important;
    border-radius:26px !important;
    overflow:hidden !important;
  }

  /* History and Pump History cards: exactly same left/right edge as the big modules above. */
  .history-section .table-wrapper,
  .pump-history-section .table-wrapper{
    position:relative !important;
    left:calc(50% - 50vw + var(--spm-standard-card-left)) !important;
    right:auto !important;
    width:var(--spm-standard-card-w) !important;
    max-width:var(--spm-standard-card-w) !important;
    min-width:var(--spm-standard-card-w) !important;
    margin:0 !important;
    transform:none !important;
    box-sizing:border-box !important;
    border-radius:26px !important;
    overflow:hidden !important;
  }

  /* Keep table behavior from v14: horizontal scrolling for full columns, sticky header. */
  .history-section .table-scroll,
  .pump-history-section .table-scroll{
    width:100% !important;
    max-width:100% !important;
    overflow:auto !important;
    overflow-x:auto !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch !important;
  }
  .history-section .data-table thead th,
  .pump-history-section .data-table thead th{
    position:sticky !important;
    top:0 !important;
    z-index:8 !important;
  }
}
@media only screen and (max-width: 430px){
  :root{--spm-standard-card-w:calc(100vw - 52px);--spm-standard-card-left:26px;}
}
</style>

<style id="mobile-tables-v16">
/* v16: restore the lighter transparent table look and force table cards to full module width. */
@media only screen and (max-width: 820px){
  /* Stop older overrides from centering/shrinking the table cards. Use the same 100% flow width as Soil/Trend modules. */
  .tables-grid,
  .history-section,
  .pump-history-section{
    display:block !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    margin-left:0 !important;
    margin-right:0 !important;
    padding-left:0 !important;
    padding-right:0 !important;
    overflow:visible !important;
    box-sizing:border-box !important;
  }
  .history-section .table-wrapper,
  .pump-history-section .table-wrapper{
    position:static !important;
    left:auto !important;
    right:auto !important;
    transform:none !important;
    display:block !important;
    width:100% !important;
    max-width:100% !important;
    min-width:100% !important;
    margin:0 !important;
    padding:0 !important;
    box-sizing:border-box !important;
    border-radius:26px !important;
    overflow:hidden !important;

    /* Previous lighter transparent green style. */
    background:rgba(6,20,13,.54) !important;
    background-image:
      linear-gradient(180deg,rgba(16,44,29,.58),rgba(5,17,11,.62)),
      radial-gradient(110% 80% at 20% 0%,rgba(110,231,166,.10),transparent 58%) !important;
    border:1px solid rgba(110,231,166,.26) !important;
    box-shadow:0 18px 45px -26px rgba(0,0,0,.72),inset 0 1px rgba(255,255,255,.05) !important;
    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;
  }
  .history-section .table-scroll,
  .pump-history-section .table-scroll{
    width:100% !important;
    max-width:100% !important;
    overflow:auto !important;
    overflow-x:auto !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch !important;
    border-radius:26px !important;
    background:transparent !important;
  }
  .history-section .table-scroll{max-height:360px !important;}
  .pump-history-section .table-scroll{max-height:300px !important;}

  /* Keep compact full-column table, with sticky header and horizontal scroll. */
  .history-section .data-table,
  .pump-history-section .data-table{
    display:table !important;
    table-layout:fixed !important;
    border-collapse:separate !important;
    border-spacing:0 !important;
    width:auto !important;
    max-width:none !important;
    background:transparent !important;
  }
  .history-section .data-table{min-width:650px !important;}
  .pump-history-section .data-table{min-width:510px !important;}
  .history-section .data-table thead,
  .pump-history-section .data-table thead{display:table-header-group !important;}
  .history-section .data-table tbody,
  .pump-history-section .data-table tbody{display:table-row-group !important;max-height:none !important;overflow:visible !important;}
  .history-section .data-table tr,
  .pump-history-section .data-table tr{display:table-row !important;}
  .history-section .data-table th,
  .history-section .data-table td,
  .pump-history-section .data-table th,
  .pump-history-section .data-table td{
    display:table-cell !important;
    white-space:nowrap !important;
    box-sizing:border-box !important;
    padding-left:10px !important;
    padding-right:10px !important;
  }
  .history-section .data-table thead th,
  .pump-history-section .data-table thead th{
    position:sticky !important;
    top:0 !important;
    z-index:9 !important;
    background:rgba(6,20,13,.88) !important;
    color:#9fb3c8 !important;
    -webkit-text-fill-color:#9fb3c8 !important;
  }
  .history-section .data-table tbody td,
  .pump-history-section .data-table tbody td{
    background:rgba(6,20,13,.32) !important;
  }
}
</style>

<style id="mobile-admin-servo-v17">
/* v17: admin card matches Current Mood width; ensure servo controls are tappable. */
@media only screen and (max-width: 820px){
  /* Match Current Mood / main cards: full content flow width, not the narrower table width rules. */
  .admin-bar{
    position:static !important;
    left:auto !important;
    right:auto !important;
    transform:none !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    margin:8px 0 10px 0 !important;
    border-radius:26px !important;
    box-sizing:border-box !important;
    overflow:hidden !important;
  }
  .admin-bar *{box-sizing:border-box !important;}

  /* Make sure no transparent overlay is stealing taps from the servo D-pad. */
  .cam-overlay:not(.open){pointer-events:none !important;}
  .cam-overlay.open{pointer-events:auto !important;}
  .cam-panel.open{pointer-events:auto !important;}
  .servo-section,
  .servo-section *,
  .dpad,
  .dpad .dp,
  .step-row-btns .sst-btn{
    pointer-events:auto !important;
    touch-action:manipulation !important;
  }
  .dpad .dp:not(.dp-empty),
  .step-row-btns .sst-btn{cursor:pointer !important;}
}
</style>

<style id="pump-servo-v18">
/* v18: decouple servo from pump/auto-water and stabilize Water Now styling. */
@media only screen and (max-width: 820px){
  /* Water Now should match the Start Stream green button styling. */
  .pump-card .pump-btn:not(.locked),
  .pump-card .pump-btn.ready,
  .pump-card .pump-btn.pumping,
  .pump-card .pump-btn.cooldown{
    background:rgba(110,231,166,.16) !important;
    background-image:none !important;
    border:1px solid rgba(110,231,166,.46) !important;
    color:#6ee7a6 !important;
    -webkit-text-fill-color:#6ee7a6 !important;
    box-shadow:inset 0 1px rgba(255,255,255,.06),0 8px 24px -18px rgba(0,0,0,.8) !important;
  }
  .pump-card .pump-btn:not(.locked) *,
  .pump-card .pump-btn.ready *,
  .pump-card .pump-btn.pumping *,
  .pump-card .pump-btn.cooldown *{
    color:#6ee7a6 !important;
    -webkit-text-fill-color:#6ee7a6 !important;
  }
  .pump-card .pump-btn:not(.locked):active,
  .pump-card .pump-btn.ready:active{
    background:rgba(110,231,166,.24) !important;
  }
  .pump-card .pump-btn.locked{
    background:transparent !important;
    background-image:none !important;
    border:none !important;
    color:#9fb3a6 !important;
    -webkit-text-fill-color:#9fb3a6 !important;
  }

  /* Servo controls are gated by Camera availability only, never by Public pump or Auto-water. */
  .servo-section:not(.camera-disabled) .dp:not(.dp-empty),
  .servo-section:not(.camera-disabled) .sst-btn{
    opacity:1 !important;
    pointer-events:auto !important;
    touch-action:manipulation !important;
    cursor:pointer !important;
  }
  .servo-section.camera-disabled .dp:not(.dp-empty),
  .servo-section.camera-disabled .sst-btn{
    opacity:.42 !important;
    pointer-events:none !important;
    cursor:not-allowed !important;
  }
}
</style>

<style id="pump-servo-admin-v19">
/* v19: pump UI correctness, servo independence, admin module width. */
@media only screen and (max-width: 820px){
  /* Admin signed-in module should match Current Mood card width/inset. */
  .admin-bar{
    position:relative !important;
    left:50% !important;
    right:auto !important;
    transform:translateX(-50%) !important;
    width:calc(100vw - 2 * clamp(18px,3vw,34px)) !important;
    max-width:calc(100vw - 2 * clamp(18px,3vw,34px)) !important;
    min-width:0 !important;
    margin:8px 0 10px 0 !important;
    border-radius:26px !important;
    box-sizing:border-box !important;
    overflow:hidden !important;
  }

  /* The blocked auto-watering note was stale/noisy; do not show it on the dashboard. */
  .pump-card .pump-note.warn{display:none !important;}

  /* Keep Water Now visually identical to Start Stream and never lose its background. */
  .pump-card .pump-btn:not(.locked){
    background:rgba(110,231,166,.16) !important;
    background-image:none !important;
    border:1px solid rgba(110,231,166,.46) !important;
    color:#6ee7a6 !important;
    -webkit-text-fill-color:#6ee7a6 !important;
    box-shadow:inset 0 1px rgba(255,255,255,.06),0 8px 24px -18px rgba(0,0,0,.8) !important;
  }
  .pump-card .pump-btn:not(.locked) *{color:#6ee7a6 !important;-webkit-text-fill-color:#6ee7a6 !important;}
  .pump-card .pump-btn.pumping,
  .pump-card .pump-btn.cooldown{opacity:1 !important;}
  .pump-card .pump-btn.cooldown .pump-btn-emoji,
  .pump-card .pump-btn.pumping .pump-btn-emoji{display:inline-flex !important;}

  /* Servo D-pad must remain enabled unless Camera is disabled. */
  .servo-section:not(.camera-disabled) .dp:not(.dp-empty),
  .servo-section:not(.camera-disabled) .sst-btn{
    opacity:1 !important;
    pointer-events:auto !important;
    touch-action:manipulation !important;
    cursor:pointer !important;
  }
  .servo-section.camera-disabled .dp:not(.dp-empty),
  .servo-section.camera-disabled .sst-btn{
    opacity:.42 !important;
    pointer-events:none !important;
    cursor:not-allowed !important;
  }
}
</style>

<script id="spm-always-live-v1">
(function(){
  "use strict";
  var API='https://ysxbsbrjwe.execute-api.ap-southeast-1.amazonaws.com';
  // Two liveness signals are sent to /live-status:
  //   * 'presence' - a VISIBLE tab. Sent on load, on becoming visible, and on a
  //     ~10s timer while visible. Presence only SUSTAINS an already-live device;
  //     it will NOT wake a sleeping one (a merely-open tab is ignored at sleep).
  //   * 'interact' - a real click/keydown/touch/pointer. This is what STARTS a
  //     live session out of power-save (and also sustains it).
  // Backend keeps the device live for 30s after the newest signal, so the ESP
  // sleeps 30s after the last visible tab stops pinging; any tab becoming
  // visible/interacting before that restarts the 30s window. Once asleep,
  // presence is ignored until a real interaction (or admin Always-On Live).
  // ---- Focused wake / keep-alive model (v3n) ----------------------------
  // ONLY two things may touch the live timers:
  //   * PUMP button click            -> 'interact'  (30s window; also a START-
  //     live wake request that survives the radio-off window via LIVE_REQUEST_TTL).
  //   * ANY click / keypress INSIDE the open camera popup (servo pan/tilt,
  //     quality, Q-bar, resolution, etc.) -> 'camwatch' (120s window, matching
  //     the ESP32-S3 cam 120s standby; also wakes a sleeping device).
  // Random clicks anywhere else - and merely having a tab open - do NOTHING:
  // they neither wake the device nor extend any timer. When the popup closes or
  // the tab is hidden we send 'camwatch_end' once so the backend drops the 120s
  // window straight back to a fresh 30s window.
  var INTERACT_THROTTLE_MS=7000;  var lastInteract=0;
  var CAMWATCH_THROTTLE_MS=8000;  var lastCamwatch=0;
  function sendLive(kind){
    try{ fetch(API+'/live-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:kind})}).catch(function(){}); }catch(e){}
  }
  function popupOpen(){ return !!document.querySelector('.cam-panel.open'); }
  function inPopup(node){ return !!(node && node.closest && node.closest('.cam-panel.open')); }
  function isPumpBtn(node){ return !!(node && node.closest && node.closest('.pump-card .pump-btn, .pump-btn')); }
  function isServoBtn(node){ return !!(node && node.closest && node.closest('.servo-section')); }
  function pingInteract(){
    var now=Date.now(); if(now-lastInteract < INTERACT_THROTTLE_MS) return;
    lastInteract=now; sendLive('interact');
  }
  function pingCamwatch(){
    var now=Date.now(); if(now-lastCamwatch < CAMWATCH_THROTTLE_MS) return;
    lastCamwatch=now; sendLive('camwatch');
  }
  function onUserAction(ev){
    if(document.visibilityState!=='visible') return;
    var t=ev && ev.target;
    if(isServoBtn(t)){ pingInteract(); pingCamwatch(); }   // servo (pan/tilt) control -> wake the pump-node like the pump button + keep the camera window alive
    else if(inPopup(t)){ pingCamwatch(); }          // any other control inside the open camera popup -> 120s
    else if(isPumpBtn(t)){ pingInteract(); }   // pump button -> 30s wake request
    // every other click/tap is ignored on purpose (no wake, no extend)
  }
  ['click','pointerdown'].forEach(function(ev){
    window.addEventListener(ev,onUserAction,{passive:true,capture:true});
  });
  // Arrow keys drive the servo while the popup is open -> treat as popup activity.
  window.addEventListener('keydown',function(){
    if(document.visibilityState==='visible' && popupOpen()) pingCamwatch();
  },{passive:true});

  // While the popup is open + visible, keep refreshing the 120s window so an
  // active viewing session is never cut at the 30s mark. The instant the popup
  // closes (or the tab is hidden) we drop back to a fresh 30s window.
  var wasWatching=false;
  function camwatchLoop(){
    var watching = popupOpen() && document.visibilityState==='visible';
    if(watching){ pingCamwatch(); }
    else if(wasWatching){ lastCamwatch=0; sendLive('camwatch_end'); }
    wasWatching=watching;
  }
  setInterval(camwatchLoop,3000);
  document.addEventListener('visibilitychange',camwatchLoop);

  // ---- Admin "Always-On Live Mode" toggle (mirrors existing admin-bar toggles) ----
  function authHeaders(){
    var h={'Content-Type':'application/json'};
    if(window.__SPM_TOKEN__) h.Authorization=window.__SPM_TOKEN__;
    return h;
  }
  var alwaysLive=false;
  function paint(){
    var b=document.getElementById('spm-al-state');
    var i=document.getElementById('spm-al-input');
    if(b){b.textContent=alwaysLive?'ON':'OFF'; b.className='toggle-state '+(alwaysLive?'on':'off');}
    if(i){i.checked=alwaysLive;}
  }
  function refreshState(){
    if(document.visibilityState!=='visible' || !window.__SPM_TOKEN__) return;   // admin-only + paused while hidden
    try{ fetch(API+'/sensor').then(function(r){return r.json();}).then(function(d){
      if(d&&d.always_live!==undefined){alwaysLive=!!d.always_live; paint();}
    }).catch(function(){}); }catch(e){}
  }
  function send(val){
    var prev=alwaysLive; alwaysLive=val; paint();
    try{ fetch(API+'/always-live',{method:'POST',headers:authHeaders(),body:JSON.stringify({enabled:val})})
      .then(function(r){ if(!r.ok){alwaysLive=prev;paint();} })
      .catch(function(){alwaysLive=prev;paint();}); }
    catch(e){alwaysLive=prev;paint();}
  }
  function inject(){
    if(!window.__SPM_TOKEN__) return;
    var host=document.querySelector('.admin-bar .admin-toggles')||document.querySelector('.admin-bar');
    if(!host) return;
    if(document.getElementById('spm-al-toggle')) return;
    var wrap=document.createElement('div');
    wrap.className='admin-toggle'; wrap.id='spm-al-toggle';
    wrap.innerHTML='<span class="admin-tog-label">Always-On Live</span>'+
      '<label class="toggle-switch"><input id="spm-al-input" type="checkbox"><span class="toggle-slider"></span></label>'+
      '<b id="spm-al-state" class="toggle-state off">OFF</b>';
    host.appendChild(wrap);
    wrap.querySelector('#spm-al-input').addEventListener('change',function(e){ send(!!e.target.checked); });
    paint();          // apply last-known state instantly so a React re-render never flashes the toggle back to OFF
    refreshState();
  }
  setInterval(function(){
    if(window.__SPM_TOKEN__){ inject(); }
    else { var t=document.getElementById('spm-al-toggle'); if(t) t.remove(); }
  },700);
  setInterval(function(){ if(window.__SPM_TOKEN__&&document.getElementById('spm-al-toggle')) refreshState(); },15000);
})();
</script>

<script id="spm-livemode-v1">
/* Live-mode nav chip + servo queued/sent state. Reads live_requested/always_live
   from GET /sensor. Injected post-render so the minified React bundle is untouched. */
(function(){
  var API='https://ysxbsbrjwe.execute-api.ap-southeast-1.amazonaws.com';
  var HOURGLASS='\u23F3';   // queued / asleep indicator
  function authHeaders(){var h={}; if(window.__SPM_TOKEN__) h.Authorization=window.__SPM_TOKEN__; return h;}
  var liveOn=false, alwaysOn=false, haveData=false, liveReq=false;
  var liveSecs=undefined, liveSecsAt=0;   // sleep countdown (s) from /sensor live_seconds_left
  var sampleTs=undefined;                 // last seen last_sample_at (epoch s) - detects a fresh upload and lets us learn the real cadence
  var sampleSeenAt=0;                       // Date.now() anchor for 'time since last upload' (clock-skew-immune once a real upload is observed)
  var wakeInterval=180;                     // effective idle wake/upload cadence (s): the 2-min sleep PLUS wake/connect/batch overhead, so it starts ~180 and SELF-CORRECTS from the real gap between uploads instead of a fixed guess
  var waking=false, wakeAt=0;
  var WAKE_CONNECT_MS=30000;   /* max time (ms) to show 'Connecting' after a wake before falling back to the M:SS wake countdown, so the chip never gets stuck on Connecting until a manual refresh */                // true once a fresh upload lands while active mode is requested = device just woke; shows an indeterminate 'Connecting...' (MQTT reconnect time is unpredictable / luck-dependent) until the WS live signal flips the chip. Reset when the chip leaves 'req'.

  function chipParts(){
    if(!haveData) return {cls:'idle', txt:'Live mode: \u2026'};
    if(alwaysOn) return {cls:'live', txt:'Live mode: ON (always)'};
    if(liveOn) return {cls:'live', txt:'Live mode: ON'};
    if(liveReq) return {cls:'req', txt:'Requested for active mode'};
    return {cls:'idle', txt:'Live mode: OFF (power-save)'};
  }
  function fmtLiveSecs(){
    var rem=(liveSecs|0)-Math.floor((Date.now()-liveSecsAt)/1000);
    if(rem<0) rem=0;
    var m=Math.floor(rem/60), s=rem%60;
    return m+':'+(s<10?'0':'')+s;
  }
  // Estimated time to the device's next wake while it is asleep with live requested.
  // remaining = wakeInterval - (time since the last upload WE observed). wakeInterval
  // self-corrects from the real gap between uploads, so the estimate tracks the actual
  // firmware cadence (sleep + wake/connect overhead) instead of a fixed guess.
  function fmtWakeSecs(){
    if(sampleTs===undefined) return null;
    if(waking){
      if(Date.now()-wakeAt <= WAKE_CONNECT_MS) return 'Connecting\u2026';
      waking=false;
    }       // device woke; MQTT reconnect time is luck-dependent, so show an indeterminate label - the WS device_status=live signal ends it at the exact instant it connects
    var age=(Date.now()-sampleSeenAt)/1000;   // measured from when WE saw the upload, so device/server clock skew can't poison it
    var rem=Math.round(wakeInterval-age);     // original plain countdown to the predicted wake (no bias margin)
    if(rem<=0) return 'Connecting\u2026';        // predicted wake reached: show 'Connecting...' instead of a stuck 0:00 - leaves room for the luck-dependent MQTT reconnect, ended exactly by the WS device_status=live signal
    var m=Math.floor(rem/60), s=rem%60;
    return m+':'+(s<10?'0':'')+s;
  }
  function updateNavChip(){
    var bars=document.querySelectorAll('.status-bar');
    for(var i=0;i<bars.length;i++){
      var bar=bars[i];
      var chip=bar.querySelector('#spm-livemode-chip');
      if(!chip){
        chip=document.createElement('div');
        chip.id='spm-livemode-chip';
        var dot=document.createElement('span'); dot.className='dot'; chip.appendChild(dot);
        var lbl=document.createElement('span'); lbl.className='lbl'; chip.appendChild(lbl);
        var upd=bar.querySelector('.status-updated');
        if(upd) bar.insertBefore(chip,upd); else bar.appendChild(chip);
      }
      var p=chipParts();
      if(p.cls!=='req') waking=false;            // left the requested-and-asleep state -> clear the wake latch so a future request counts down fresh
      if(chip.className!==p.cls) chip.className=p.cls;
      var l=chip.querySelector('.lbl'); if(l && l.textContent!==p.txt) l.textContent=p.txt;
      var t=chip.querySelector('.lm-timer');
      var liveCd=(p.cls==='live' && !alwaysOn && liveOn && liveSecs!==null && liveSecs!==undefined && ((liveSecs|0)-Math.floor((Date.now()-liveSecsAt)/1000) > 0));
      var cd=null;
      if(liveCd){ cd='\u23F3 '+fmtLiveSecs(); }                          // live: keep the hourglass sleep countdown
      else if(p.cls==='req'){ var w=fmtWakeSecs(); if(w!==null) cd=w; }   // requested+asleep: plain M:SS wake estimate, no icon
      if(cd!==null){
        if(!t){ t=document.createElement('span'); t.className='lm-timer'; chip.appendChild(t); }
        if(t.textContent!==cd) t.textContent=cd;
      } else if(t){ t.parentNode.removeChild(t); }
    }
  }

  function servoStateEl(){
    var sec=document.querySelector('.servo-section'); if(!sec) return null;
    var el=sec.querySelector('#spm-servo-state');
    if(!el){ el=document.createElement('div'); el.id='spm-servo-state'; sec.appendChild(el); }
    return el;
  }
  // Camera servo is LIVE-ONLY. In live mode every move is confirmed against the
  // device (firmware acks via plant/servo-status -> last_servo_at bumps). When
  // asleep we do NOT queue -- we tell the user to wake the device first.
  var CHECK='\u2705';        // confirmed by device
  var WARN='\u26A0\uFE0F';    // no confirmation
  var srvAckTs=0;            // last_servo_at from GET /servo (device-confirmed move time)
  function setServo(ico,msg,cls){
    var el=servoStateEl(); if(!el) return;
    el.innerHTML='<span class="spm-ss-ico">'+ico+'</span><span>'+msg+'</span>'; el.className=cls;
  }
  function refreshServoBaseline(){
    var el=servoStateEl(); if(!el) return;
    if(el.dataset.flash==='1') return;
    if(!haveData){ el.innerHTML=''; el.className=''; return; }
    if(liveOn){ setServo('\uD83D\uDFE2','Live \u2014 moves apply instantly','sent'); }
    else { setServo(HOURGLASS,'Power-save - click pan/tilt to request active mode','queued'); }
  }
  function pollServoAck(){
    if(document.visibilityState!=='visible' || !window.__SPM_TOKEN__) return;   // admin-only + paused while hidden
    fetch(API+'/servo',{headers:authHeaders()}).then(function(r){return r.json();}).then(function(d){
      if(d&&typeof d.last_servo_at!=='undefined'){ srvAckTs=d.last_servo_at||0; }
    }).catch(function(){});
  }
  function confirmServo(beforeTs){
    var el=servoStateEl(); if(!el) return;
    var tries=0, MAX=10;   // ~10s @ 1s
    clearInterval(el._c);
    el._c=setInterval(function(){
      tries++;
      fetch(API+'/servo',{headers:authHeaders()}).then(function(r){return r.json();}).then(function(d){
        var ts=(d&&d.last_servo_at)||0;
        var stillLive=(d&&typeof d.device_live!=='undefined')?!!d.device_live:liveOn;
        if(ts>beforeTs+0.001){
          srvAckTs=ts; clearInterval(el._c);
          setServo(CHECK,'Move confirmed by device','sent');
          clearTimeout(el._t); el._t=setTimeout(function(){ el.dataset.flash='0'; refreshServoBaseline(); },2500);
        } else if(!stillLive){
          clearInterval(el._c);
          setServo(HOURGLASS,'Device went to sleep \u2014 move not applied','queued');
          clearTimeout(el._t); el._t=setTimeout(function(){ el.dataset.flash='0'; refreshServoBaseline(); },3000);
        } else if(tries>=MAX){
          clearInterval(el._c);
          setServo(WARN,'No confirmation from device \u2014 try again','queued');
          clearTimeout(el._t); el._t=setTimeout(function(){ el.dataset.flash='0'; refreshServoBaseline(); },3500);
        }
      }).catch(function(){ if(tries>=MAX){ clearInterval(el._c); } });
    },1000);
  }
  document.addEventListener('click',function(ev){
    var btn=ev.target&&ev.target.closest&&ev.target.closest('.servo-section .dpad .dp');
    if(!btn||btn.classList.contains('dp-empty')) return;
    var el=servoStateEl(); if(!el) return;
    el.dataset.flash='1';
    if(liveOn){
      var before=srvAckTs;
      setServo('\uD83D\uDFE2','Sent \u2014 confirming with device\u2026','sent');
      confirmServo(before);
    } else {
      clearInterval(el._c);
      setServo(HOURGLASS,'Requested active mode - waking the camera, then try the move again','queued');
      clearTimeout(el._t); el._t=setTimeout(function(){ el.dataset.flash='0'; refreshServoBaseline(); },4000);
    }
  },true);

  function poll(){
    if(document.visibilityState!=='visible') return;   // pause /sensor polling while tab hidden
    fetch(API+'/sensor',{headers:authHeaders()})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||d.error) return;
        if(typeof d.live_requested!=='undefined'){ haveData=true; liveReq=!!d.live_requested; }
        if(typeof d.device_live!=='undefined'){ liveOn=!!d.device_live; }
        if(typeof d.always_live!=='undefined'){ alwaysOn=!!d.always_live; }
        if(typeof d.live_seconds_left!=='undefined'){ liveSecs=(d.live_seconds_left===null?null:Number(d.live_seconds_left)); liveSecsAt=Date.now(); }
        if(typeof d.last_sample_at!=='undefined' && d.last_sample_at!==null){
          var lsa=Number(d.last_sample_at);
          var sn=(typeof d.server_now!=='undefined'&&d.server_now!==null)?Number(d.server_now):(Date.now()/1000);
          // SIMPLEST METHOD: time since the last uploaded log straight from the server clock (server_now - last_sample_at), re-synced on EVERY poll so it can't drift; Date.now() advances it between polls. remaining = wakeInterval - this age.
          sampleSeenAt=Date.now()-Math.max(0,(sn-lsa))*1000;
          if(sampleTs!==undefined && lsa>sampleTs){
            // A fresh log arrived = the device just woke and uploaded: learn the real cadence and flag Connecting until it actually goes live.
            var gap=lsa-sampleTs;
            if(gap>=60 && gap<=600){ wakeInterval=Math.round(0.6*wakeInterval+0.4*gap); }
            if(liveReq && !liveOn && !alwaysOn){ waking=true; wakeAt=Date.now(); }
          }
          sampleTs=lsa;
        }
        updateNavChip(); refreshServoBaseline();
      }).catch(function(){});
  }
  // Live WS: chip/servo react instantly to the firmware's real state, like the stream.
  // Lambda broadcasts {type:device_status, device_live} on enterLive/enterIdle and
  // {type:always_live_update}. The 5s /sensor poll still runs as the authoritative
  // recency check (DEVICE_LIVE_TTL) so a hard power-off (no idle broadcast) still
  // flips the chip OFF within the TTL window.
  var WSURL="wss://fbtd8vs7p1.execute-api.ap-southeast-1.amazonaws.com/production";
  var lmws=null, lmwsT=null;
  function applyLiveMsg(d){
    if(!d||!d.type) return; var changed=false;
    if(d.type==="device_status"){ haveData=true; liveOn=!!d.device_live; if(typeof d.live_seconds_left!=="undefined"){ liveSecs=(d.live_seconds_left===null?null:Number(d.live_seconds_left)); liveSecsAt=Date.now(); } changed=true; }
    else if(d.type==="always_live_update"){ haveData=true; alwaysOn=!!d.always_live; changed=true; }
    if(changed){ updateNavChip(); refreshServoBaseline(); }
  }
  function connectLiveWS(){
    try{ lmws=new WebSocket(WSURL); }catch(e){ clearTimeout(lmwsT); lmwsT=setTimeout(connectLiveWS,2500); return; }
    lmws.addEventListener("message",function(ev){ try{ applyLiveMsg(JSON.parse(ev.data)); }catch(e){} });
    lmws.addEventListener("close",function(){ clearTimeout(lmwsT); lmwsT=setTimeout(connectLiveWS,2500); });
    lmws.addEventListener("error",function(){ try{ lmws.close(); }catch(e){} });
  }
  function tick(){ updateNavChip(); refreshServoBaseline(); }
  // Adaptive /sensor cadence: poll fast (1.5s) right around the predicted wake and during the
  // reconnect tail so the timer SNAPS to the real state within ~1.5s instead of lagging up to 5s
  // (the 'still at 0:06 after it already woke' drift). Otherwise the normal 5s cadence.
  function nextPollDelay(){
    if(waking && Date.now()-wakeAt <= WAKE_CONNECT_MS) return 1500;
    if(liveReq && !liveOn && !alwaysOn && sampleTs!==undefined){
      var age=(Date.now()-sampleSeenAt)/1000;
      if(age >= wakeInterval-25) return 1500;   // entering the wake window -> watch closely so we catch the upload fast
    }
    return 5000;
  }
  function pollLoop(){ poll(); setTimeout(pollLoop, nextPollDelay()); }
  function boot(){ pollLoop(); pollServoAck(); tick(); connectLiveWS(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
  setInterval(pollServoAck,5000);
  setInterval(tick,1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ poll(); pollServoAck(); } });   // resume instantly on refocus
})();
</script>

  // Identify a photo by its stable S3 key (falls back to url) so dead images

  function photoEpoch(p) {

      .sort(function (a, b) { var d = photoEpoch(b.p) - photoEpoch(a.p); return d || (b.i - a.i); })

      var gone = false, i;

        }

  function mergeJournalDays(incoming) {

      });
    });
    state.days.sort(function (a,b) { return String(a.date) < String(b.date) ? 1 : -1; });
  }

  function fetchJournal(opts, cb) {
    if (typeof opts === "function") { cb = opts; opts = {}; }
    opts = opts || {};
    if (state.loading) return;
    var reset = opts.reset !== false;
    var date = String(opts.date || "");
    state.loading = true;
    if (reset && !date) {

      state.loadedKeys = {}; state.nextCursor = null; state.hasMore = false; state.active = 0;

    var params = ["limit=" + encodeURIComponent(opts.limit || state.pageSize)];
    if (!reset && state.nextCursor) params.push("cursor=" + encodeURIComponent(state.nextCursor));
    if (date) params.push("date=" + encodeURIComponent(date));
    fetch(API_BASE + "/journal?" + params.join("&"), { headers: authHeaders() })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        mergeJournalDays(Array.isArray(data.days) ? data.days : []);
        if (!date) { state.nextCursor = data.next_cursor || null; state.hasMore = !!data.has_more; }
        state.loaded = true; state.loading = false;
        if (state.active >= state.days.length) state.active = 0;
        probeImages(); renderBar(); renderModal();
        if (typeof cb === "function") cb();
      })
      .catch(function (e) {
        console.error("[journal] load failed", e); state.loaded = true; state.loading = false;
        renderBar(); renderModal();
      });
  }

  function fetchJournalDate(date, cb) {

      body: JSON.stringify({ key: p.key, date: p.date })

      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function () {

      .catch(function (e) {

      (state.days || []).forEach(function (d) { (d.photos || []).forEach(function (ph) { if (!isDead(ph)) state.selected[ph.key] = { key: ph.key, date: d.date }; }); });
      renderModal();
    });

    clr.addEventListener("click", function () { state.selected = {}; renderModal(); });
    bar.appendChild(clr);

    run.id = "spm-bulk-run";

  function runBulkRelabel() {
    var queue = selectedKeys();
    if (!queue.length || state.relabeling) return;
    var total = queue.length;
    if (!window.confirm("Re-run AI on " + total + " selected photo" + (total !== 1 ? "s" : "") + "? Each photo uses one Gemini analysis, so this counts against your API quota.")) return;
    state.relabeling = "__bulk__";
    var okCount = 0, failCount = 0;
    refreshBulkUI(0, total);
    function step() {
      if (!queue.length) {
        state.relabeling = null;
        state.selected = {};
        renderModal();
        alert("Re-labelled " + okCount + " of " + total + " photo" + (total !== 1 ? "s" : "") + (failCount ? (" \u2014 " + failCount + " failed (likely rate limit; try again shortly).") : "."));
        return;
      }
      var key = queue.shift();
      var meta = state.selected[key] || {};
      var pRef = findPhotoByKey(key);
      refreshBulkUI(total - queue.length, total);
      fetch(API_BASE + "/journal/relabel", { method:"POST", headers:Object.assign({"Content-Type":"application/json"},authHeaders()),
        body:JSON.stringify({ key: key, date: (pRef && pRef.date) || meta.date }) })
        .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
        .then(function(res){ okCount++; applyLabelToPhoto(key, res); step(); })
        .catch(function(){ failCount++; step(); });
    }
    step();
  }

  function renderModal(create) {

    panel.appendChild(head);

    var days = visibleDays();

    function monthKey(iso) {

    var monthMap = {};

    var monthKeys = Object.keys(monthMap).sort(function (a, b) { return a < b ? 1 : (a > b ? -1 : 0); });
    monthKeys.forEach(function (key) {
      monthMap[key].sort(function (a, b) { return String(a.date) < String(b.date) ? 1 : -1; });
    });
    if (!state.selectedMonth || !monthMap[state.selectedMonth]) state.selectedMonth = monthKeys[0];

    function appendDesktopDays() {
      var row = el("div", "jpm-days");

        b.addEventListener("click", function () {

    function appendBackBar(label, title, subtitle, handler) {
      var bar = el("div", "jpm-mobile-selected");

      monthKeys.forEach(function (key) {

        var b = el("button", "jpm-day jpm-month");
        b.type = "button";
        b.appendChild(el("span", "d", monthLabel(key)));
        b.appendChild(el("span", "c", monthDays.length + " day" + (monthDays.length !== 1 ? "s" : "") + " \u00B7 " + photoCount + " photo" + (photoCount !== 1 ? "s" : "")));
        b.addEventListener("click", function () {

      panel.appendChild(months);
      m.appendChild(panel);
      return;
    } else if (mobileView === "dates") {
      panel.classList.add("jpm-date-index");
      var monthDays = monthMap[state.selectedMonth] || [];
      var monthPhotos = 0;
      monthDays.forEach(function (d) { monthPhotos += visiblePhotos(d).length; });
      appendBackBar("Months", monthLabel(state.selectedMonth), monthDays.length + " tracked day" + (monthDays.length !== 1 ? "s" : "") + " \u00B7 " + monthPhotos + " photos", function () {
        state.mobileJournalView = "months";
        renderModal();
      });
      var row = el("div", "jpm-days");
      monthDays.forEach(function (d) {
        var globalIndex = days.indexOf(d);
        var b = el("button", "jpm-day" + (globalIndex === state.active ? " active" : ""));
        b.type = "button";
        b.appendChild(el("span", "d", prettyDate(d.date)));
        var count = visiblePhotos(d).length;
        b.appendChild(el("span", "c", count + " photo" + (count !== 1 ? "s" : "")));
        b.addEventListener("click", function () {
          state.active = globalIndex;
          state.mobileJournalView = "detail";
          state.mobileViewingDay = true;
          renderModal();
        });
        row.appendChild(b);
      });
      panel.appendChild(row);
      m.appendChild(panel);
      return;
    } else {
      day = days[state.active] || days[0];
      state.selectedMonth = monthKey(day.date);
      appendBackBar("Dates", prettyDate(day.date), (function () {
        var count = visiblePhotos(day).length;
        return count + " photo" + (count !== 1 ? "s" : "");
      })(), function () {
        state.mobileJournalView = "dates";
        state.mobileViewingDay = false;
        renderModal();
      });
    }

    panel.appendChild(buildDaySummary(day.date, state.summaries[day.date]));
    var photos = visiblePhotos(day);
    var strip = el("div", "jpm-strip");
    var loading = el("div", "jpm-msg", "Loading photos\u2026");
    strip.appendChild(loading);

    var total = photos.length, settled = 0, shown = 0;
    function dropLoading() { if (loading.parentNode) loading.parentNode.removeChild(loading); }
    function settle(didShow) {
      settled++;
      if (didShow) shown++;
      if (settled >= total) {
        dropLoading();
        if (shown === 0 && !strip.querySelector(".jp-card")) {
          strip.appendChild(el("div", "jpm-msg", "No viewable photos for this day."));
        }
      }
    }
    if (total === 0) { dropLoading(); strip.appendChild(el("div", "jpm-msg", "No viewable photos for this day.")); }

    photos.forEach(function (p) {
      p.date = day.date;
      var card = el("div", "jp-card" + (p.slot === "snap" ? " snap" : ""));
      card.setAttribute("data-slot", p.slot || "");
      card.setAttribute("data-date", day.date || "");
      card.setAttribute("data-key", p.key || "");
      card.setAttribute("data-ts", (p.ts != null ? String(p.ts) : ""));
      card.style.display = "none"; // stay hidden until the image actually loads
      var a = el("a"); a.href = p.url; a.target = "_blank"; a.rel = "noreferrer";
      // NOTE: do NOT use loading="lazy" here — a hidden (display:none) card is
      // never in the viewport, so a lazy image would never load and the strip
      // would stay stuck on "Loading photos…". Load eagerly instead.
      var img = el("img"); img.decoding = "async";
      img.alt = day.date + " " + (p.label || p.slot);
      img.addEventListener("load", function () {
        dropLoading();
        card.style.display = "";
        requestAnimationFrame(function () { card.classList.add("ready"); });
        settle(true);
      });
      img.addEventListener("error", function () {
        // Missing / expired / just-deleted object: never show it, remember it.
        if (card.parentNode) card.parentNode.removeChild(card);
        markDead(p);
        settle(false);
      });
      img.src = p.url;
      a.appendChild(img); card.appendChild(a);
      var cap = el("div", "jp-cap");
      cap.appendChild(el("span", "t", p.time || ""));
      cap.appendChild(el("span", "l", p.label || p.slot));
      var metaBadges=el("span","jp-meta");
      if(p.slot==="snap")metaBadges.appendChild(el("span","b","admin"));
      var hasPublicLabel=!!(p.caption||(p.objects&&p.objects.length)||(p.tags&&p.tags.length)),labelDetail=null;
      if(hasPublicLabel){var labelBtn=el("button","jp-label-btn","Label");labelBtn.type="button";labelBtn.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();if(labelDetail)labelDetail.hidden=!labelDetail.hidden;});metaBadges.appendChild(labelBtn);}
      if(p.label_status)metaBadges.appendChild(el("span","jp-ai",labelStatusText(p.label_status)));
      if(metaBadges.childNodes.length)cap.appendChild(metaBadges);card.appendChild(cap);
      if(hasPublicLabel){var bits=[];if(p.caption)bits.push(String(p.caption));var words=(p.objects||[]).concat(p.tags||[]).filter(Boolean);if(words.length)bits.push("Tags: "+words.filter(function(v,i,a){return a.indexOf(v)===i;}).join(", "));labelDetail=el("div","jp-label-detail",bits.join(" · "));labelDetail.hidden=true;card.appendChild(labelDetail);}
      if (state.edit && isAdmin()) {
        var isSelected=!!state.selected[p.key],selWrap=el("label","jp-sel"+(isSelected?" selected":""));
        var cb=el("input");cb.type="checkbox";cb.checked=isSelected;var mark=el("span","jp-sel-mark","\u2713");
        cb.addEventListener("click",function(e){e.stopPropagation();});cb.addEventListener("change",function(){if(cb.checked)state.selected[p.key]={key:p.key,date:p.date};else delete state.selected[p.key];selWrap.classList.toggle("selected",cb.checked);refreshBulkUI();});selWrap.appendChild(cb);selWrap.appendChild(mark);card.appendChild(selWrap);
        var acts = el("div", "jp-actions");
        var review = el("button", "jp-act act-review", "Review labels");
        review.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); openLabelReview(p,card); });
        acts.appendChild(review);
        var reai = el("button", "jp-act act-reai", (state.relabeling === p.key) ? "Re-running\u2026" : "Re-run AI");
        reai.disabled = !!state.relabeling;
        reai.title = "Ask Gemini to analyse this photo again and replace its labels.";
        reai.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();

          fetch(API_BASE + "/journal/relabel", { method:"POST", headers:Object.assign({"Content-Type":"application/json"},authHeaders()),
            body:JSON.stringify({key:p.key,date:p.date}) })
            .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
            .then(function(res){ applyLabelToPhoto(p.key, res); state.relabeling = null; renderModal(); })
            .catch(function(){ state.relabeling = null; alert("Re-run AI could not be completed (rate limit or error)."); renderModal(); });
        });

  /* ── visitor snapshot -> Admin Login popup ─────────────────── */
  function openSignIn() {
    var b = document.querySelector(".nav-signin-btn");
    if (b) { b.click(); return true; }
    return false;
  }
  // Read live-stream state from the Start/Stop toggle button label.
  function streamOn() {
    var btns = document.querySelectorAll(".cam-btn");
    for (var i = 0; i < btns.length; i++) {
      var tx = btns[i].textContent || "";
      if (/stop stream/i.test(tx)) return true;   // showing "Stop Stream" => live
      if (/start stream/i.test(tx)) return false; // showing "Start Stream" => off
    }
    return false;
  }
  function wireSnapshotGate() {
    // Capture-phase interceptor: a logged-out visitor clicking the camera
    // "Save to AWS" (snapshot) button gets the Admin Login popup instead.
    document.addEventListener("click", function (e) {
      var t = e.target;
      var btn = (t && t.closest) ? t.closest(".cam-btn.snapshot-btn") : null;
      if (btn && !isAdmin()) {
        e.preventDefault();
        e.stopImmediatePropagation();
        openSignIn();
      }
    }, true);
    // The button is disabled for non-admins. Only make it clickable for a
    // visitor while the stream is LIVE; keep it greyed/disabled when the stream
    // is off (matching the admin behaviour). A disabled control emits no click,
    // so this is what lets the gate above run only when appropriate.
    setInterval(function () {
      if (isAdmin()) return;
      var btn = document.querySelector(".cam-btn.snapshot-btn");
      if (!btn) return;
      if (streamOn()) {
        if (btn.disabled) { btn.disabled = false; btn.title = "Sign in to save snapshots"; }
      } else if (!btn.disabled) {
        btn.disabled = true; // stream off -> grey it out like for admins
      }
    }, 800);
  }

  /* ── mount / self-heal on re-render ──────────────��──────────── */
  function findHeading() {
    var hs = document.querySelectorAll("h1,h2,h3,h4");
    for (var i = 0; i < hs.length; i++) {
      if (HEADING_MATCH.test(hs[i].textContent || "")) return hs[i];
    }
    return null;
  }
  function ensureMounted() {
    // The mount now belongs to React itself. Never append/move nodes inside the
    // React tree: WebKit can reconcile that external mutation differently and
    // drop the complete journal section on iOS.
    var mount = document.getElementById(MOUNT_ID);
    if (!mount || !mount.isConnected) return;
    if (!mount.querySelector(".jp-bar")) renderBar();
    if (!state.loaded && !state.loading) fetchJournal();
  }
  function syncLoginLayer() {
    // Do not rely on :has(). A real body class works on every supported iOS and
    // keeps the still-open camera state intact while its layer is temporarily hidden.
    document.body.classList.toggle("spm-login-open", !!document.querySelector(".login-overlay"));
  }
  var scheduled = false;
  function scheduleEnsure() {
    if (scheduled) return;
    scheduled = true;
    (window.requestAnimationFrame || setTimeout)(function () { scheduled = false; ensureMounted(); });
  }
  /* ── public navigation API (used by the chat assistant) ───── */
  function normJournalDate(d) {
    if (!d && d !== 0) return "";
    var s = String(d).trim();
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
    var dt = new Date(s);
    if (!isNaN(dt.getTime())) {
      return dt.getFullYear() + "-" + ("0" + (dt.getMonth() + 1)).slice(-2) + "-" + ("0" + dt.getDate()).slice(-2);
    }
    return s.toLowerCase();
  }
  function findDayIndex(date) {
    var days = visibleDays();
    var target = normJournalDate(date);
    if (!target) return -1;
    var i;
    for (i = 0; i < days.length; i++) {
      if (normJournalDate(days[i].date) === target) return i;
    }
    // Fallback: ignore the year and match month-day, so "July 16" style inputs
    // still land on the right day even if the year is missing or off.
    var md = target.length >= 10 ? target.slice(5) : "";
    if (md) {
      for (i = 0; i < days.length; i++) {
        if (normJournalDate(days[i].date).slice(5) === md) return i;
      }
    }
    return -1;
  }
  function highlightPhoto(sel) {
    var m = document.getElementById(MODAL_ID);
    if (!m) return;
    var cards = m.querySelectorAll(".jp-card");
    if (!cards.length) return;
    var key = null, slot = null;
    if (sel && typeof sel === "object") { key = sel.key || null; slot = sel.slot || null; }
    else { slot = sel || null; }
    var target = null, i;
    // Exact photo first: match the unique S3 key so the photo SHOWN is the same
    // one that was analyzed/asked for, even when a day holds many photos.
    if (key) {
      for (i = 0; i < cards.length; i++) {
        if ((cards[i].getAttribute("data-key") || "") === key) { target = cards[i]; break; }
      }
    }
    if (!target && slot) {
      for (i = 0; i < cards.length; i++) {
        if ((cards[i].getAttribute("data-slot") || "") === slot) { target = cards[i]; break; }
      }
    }
    if (!target && sel && typeof sel === "object" && sel.index != null) { var n = parseInt(sel.index,10)||0; if (cards[n]) target = cards[n]; }
    if (!target) target = cards[0];
    try { target.scrollIntoView({ behavior: "smooth", inline: "center", block: "center" }); }
    catch (e) { try { target.scrollIntoView(); } catch (e2) {} }
    target.classList.add("jp-flash");
    setTimeout(function () { try { target.classList.remove("jp-flash"); } catch (e) {} }, 2600);
  }
  function openToPhoto(date, slot, key, index) {
    slot = slot ? String(slot).toLowerCase() : null;
    key = key || null;
    index = Math.max(0, parseInt(index || 0, 10) || 0);
    function go() {
      var days = visibleDays();
      if (!days.length) { openModal(); return; }
      var idx = date ? findDayIndex(date) : -1;
      if (idx < 0) idx = 0;
      state.active = idx;
      if (window.matchMedia && window.matchMedia("(max-width: 640px)").matches) {
        state.mobileJournalView = "detail";
        state.mobileViewingDay = true;
      }
      renderModal(true);
      // Photo cards fade in only once their image loads. When we know the exact
      // photo (key), wait until THAT card is visible; otherwise wait for any.
      var tries = 0;
      (function attempt() {
        var mm = document.getElementById(MODAL_ID), ready = false;
        if (mm) {
          var cs = mm.querySelectorAll(".jp-card"), j;
          if (key) {
            for (j = 0; j < cs.length; j++) {
              if ((cs[j].getAttribute("data-key") || "") === key && cs[j].style.display !== "none") { ready = true; break; }
            }
          } else if (cs.length) { ready = true; }
        }
        if (ready || tries > 30) { highlightPhoto({ key: key, slot: slot, index: index }); return; }
        tries++;
        setTimeout(attempt, 150);
      })();
    }
    if (!state.loaded) { fetchJournal({ reset:true }, go); }
    else if (date && findDayIndex(date) < 0) { fetchJournalDate(date, go); }
    else { go(); }
  }
  try {
    window.__SPM_JOURNAL__ = { open: openModal, openToPhoto: openToPhoto, close: closeModal };
  } catch (e) {}

  function start() {
    injectStyle();
    ensureMounted();
    wireSnapshotGate();
    syncLoginLayer();
    var mo = new MutationObserver(function () { scheduleEnsure(); syncLoginLayer(); });
    mo.observe(document.body, { childList: true, subtree: true });
    setInterval(ensureMounted, 2000);
    window.addEventListener("spm:journal_update", function () { fetchJournal(); });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>

    card.appendChild(day);

    if(pred && pred.generated_at){ card.appendChild(el("div","spm-ml-foot","Updated "+new Date(Number(pred.generated_at)*1000).toLocaleString())); }

  }

  function render(){ var sec=document.getElementById(SEC_ID); if(!sec) return; sec.innerHTML=""; sec.appendChild(buildCard(state.data)); }

<script id="spm-journal-refresh-v1">
"use strict";
/* Growth-journal photo auto-refresh (PC + mobile). S3 presigned URLs expire
   while the tab is backgrounded; on return the browser re-requests a stale URL
   and shows a broken image. Re-fetch fresh URLs (via the journal injector's own
   handler) whenever the tab regains focus / becomes visible / is restored from
   the mobile back-forward cache. */
(function () {
  var last = 0;
  function refresh() {
    var now = Date.now();
    if (now - last < 1500) return;            // throttle bursts
    last = now;
    try { window.dispatchEvent(new Event("spm:journal_update")); } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") refresh();
  });
  window.addEventListener("focus",    function () { refresh(); });   // desktop tab focus
  window.addEventListener("pageshow", function () { refresh(); });   // iOS/Android bfcache restore
  window.addEventListener("online",   function () { refresh(); });   // network regained
})();
</script>

          row.style.cssText = "display:flex;width:100%;margin-bottom:8px;" + (m.role === "user" ? "justify-content:flex-end;" : "justify-content:flex-start;");

          var bubble = document.createElement("div");
          var bg = m.role === "user" ? "rgba(120,200,120,.28)" : (m.role === "error" ? "rgba(220,120,100,.25)" : "rgba(255,255,255,.10)");
          var bcolor = m.role === "error" ? "#f5c9b8" : "#e6f3ec";
          bubble.style.cssText = "max-width:85%;box-sizing:border-box;padding:8px 11px;border-radius:12px;background:" + bg + ";color:" + bcolor + ";font-size:.82rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;" + (m.pending ? "font-style:italic;opacity:.85;" : "");
          var answerText = document.createElement("div");
          answerText.textContent = m.text;
          bubble.appendChild(answerText);
          if (m.role === "assistant" && Array.isArray(m.sources) && m.sources.length) {
            var sourceBox = document.createElement("div");
            sourceBox.style.cssText = "margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.13);display:flex;flex-wrap:wrap;gap:6px;";
            var sourceLabel = document.createElement("span");
            sourceLabel.textContent = "Sources:";
            sourceLabel.style.cssText = "width:100%;font-size:.68rem;color:#9fd0bf;font-weight:700;";
            sourceBox.appendChild(sourceLabel);
            m.sources.slice(0, 3).forEach(function(src, si) {
              if (!src || !src.url) return;
              var link = document.createElement("a");
              link.href = src.url;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              var label = String(src.title || "Source " + (si + 1)).replace(/^https?:\/\//, "").replace(/\/$/, "");
              if (label.length > 34) label = label.slice(0, 31) + "...";
              link.textContent = label;
              link.title = String(src.title || src.url);
              link.style.cssText = "display:inline-block;max-width:100%;padding:4px 7px;border-radius:7px;border:1px solid rgba(94,159,232,.35);background:rgba(94,159,232,.10);color:#a9d3ff;text-decoration:none;font-size:.68rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
              sourceBox.appendChild(link);
            });
            bubble.appendChild(sourceBox);
          }
          row.appendChild(bubble);
          log.appendChild(row);
        }
        log.scrollTop = log.scrollHeight;
      }
      renderHistory();

      // Input row (bottom, fixed within panel)
      var inputRow = document.createElement("div");
      inputRow.style.cssText = "display:flex;gap:8px;align-items:flex-end;width:100%;box-sizing:border-box;padding:10px 14px;border-top:1px solid rgba(255,255,255,.14);flex:0 0 auto;";
      panel.appendChild(inputRow);

      var inp = document.createElement("textarea");
      inp.rows = 1;
      inp.maxLength = MAXLEN;
      inp.placeholder = "e.g. How is the plant doing?";
      inp.style.cssText = "display:block;flex:1 1 auto;min-width:0;height:40px;min-height:40px;max-height:110px;resize:none;font-size:.85rem;line-height:1.35;color:#eafff4;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 10px;outline:none;box-sizing:border-box;font-family:inherit;";
      inputRow.appendChild(inp);

      var sendBtn = document.createElement("button");
      sendBtn.type = "button";
      sendBtn.textContent = "Ask";
      sendBtn.style.cssText = "display:inline-block;flex:0 0 auto;cursor:pointer;font-weight:700;font-size:.8rem;line-height:1.35;padding:10px 16px;min-height:40px;box-sizing:border-box;border-radius:10px;border:1px solid rgba(120,200,120,.5);background:rgba(120,200,120,.28);color:#eafff4;white-space:nowrap;font-family:inherit;";
      inputRow.appendChild(sendBtn);

      // -- Floating launcher bubble (shown when panel is minimized) --------
      var bubbleBtn = document.createElement("button");
      bubbleBtn.type = "button";
      bubbleBtn.textContent = "\uD83C\uDF31";
      bubbleBtn.style.cssText = "display:none;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(120,200,120,.9);color:#fff;font-size:1.4rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);align-items:center;justify-content:center;padding:0;";
      host.appendChild(bubbleBtn);

      var collapsed = true;
      function setCollapsed(v) {
        collapsed = v;
        panel.style.display = collapsed ? "none" : "flex";
        bubbleBtn.style.display = collapsed ? "flex" : "none";
        if (!collapsed) { renderHistory(); }
      }
      // Start minimized on every page load - show only the launcher bubble.
      setCollapsed(true);
      head.addEventListener("click", function () { setCollapsed(true); });
      bubbleBtn.addEventListener("click", function () { setCollapsed(false); try { inp.focus(); } catch (e) {} });

      inp.addEventListener("click", function (e) { e.stopPropagation(); });
      inp.addEventListener("input", function () {
        inp.style.height = "auto";
        inp.style.height = Math.max(40, Math.min(inp.scrollHeight, 110)) + "px";
      });

      // -- Assistant-driven UI navigation ---------------------------------
      function spmScrollHighlight(node) {
        if (!node) return;
        var isPageTop = !!(node.matches && node.matches(".page-titlestrip,.mood-banner,.main"));
        var isDashboardHero = !!(node.matches && node.matches(".dash-grid,.pmv-hero"));
        var isDeviceStatus = !!(node.matches && node.matches(".status-bar,.cam-health-strip"));
        var focusNodes = isDeviceStatus
          ? Array.prototype.slice.call(document.querySelectorAll(".status-bar,.cam-health-strip"))
          : [node];
        try {
          if (isPageTop) window.scrollTo({ top: 0, behavior: "smooth" });
          else if (isDashboardHero || isDeviceStatus) window.scrollTo({ top: Math.max(0, node.getBoundingClientRect().top + window.scrollY - 96), behavior: "smooth" });
          else node.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
        }
        catch (e) { try { node.scrollIntoView(); } catch (e2) {} }
        try {
          focusNodes.forEach(function (n) { n.classList.add("spm-focus-flash"); });
          setTimeout(function () { focusNodes.forEach(function (n) { try { n.classList.remove("spm-focus-flash"); } catch (e) {} }); }, 2600);
        } catch (e) {}
      }
      function spmText(el){ return String((el && el.textContent) || "").toLowerCase().replace(/\s+/g," ").trim(); }
      function spmFirst(sel){ try { return document.querySelector(sel); } catch(e) { return null; } }
      function spmByText(selectors, tests, preferClosest) {
        var nodes = document.querySelectorAll(selectors);
        for (var i = 0; i < nodes.length; i++) {
          var t = spmText(nodes[i]);
          for (var j = 0; j < tests.length; j++) {
            if (tests[j].test(t)) return (preferClosest && nodes[i].closest && nodes[i].closest(preferClosest)) || nodes[i];
          }
        }
        return null;
      }
      function spmFindSection(which) {
        which = String(which || "").toLowerCase().trim();
        var w = which.replace(/[^a-z0-9]/g, "");
        var direct = null;
        if (/^(hero|herosection|dashboardhero|herodashboard|dashboardtop|top|topmost|mainhero|dashboard)$/.test(w) || (w.indexOf("hero") >= 0 && w.indexOf("journal") < 0)) direct = spmFirst(".dash-grid") || spmFirst(".pmv-hero") || spmFirst(".main");
        else if (/^(journal|growthjournal|photos|photo|gallery)$/.test(w)) direct = document.getElementById("spm-journal-photos");
        else if (/^(assistant|ask|chat|chatbot|asktheplant)$/.test(w)) direct = document.getElementById("spm-ask-section") || document.getElementById("spm-ask-fixed");
        else if (/^(ml|ai|intelligence|plantintelligence|prediction|predictions|forecast|forecasts|machinelearning)$/.test(w)) direct = document.getElementById("spm-ml-section") || spmByText(".spm-ml-title,h1,h2,h3,.section-title,.section-heading", [/plant intelligence/,/machine learning/,/predictions?/,/forecast/], ".glass,section,.info-card");
        else if (w.indexOf("devicestatus") >= 0 || w.indexOf("statusbar") >= 0 || w.indexOf("esp32s3camstatus") >= 0 || w.indexOf("esp32camstatus") >= 0 || w.indexOf("camerastatus") >= 0 || w.indexOf("connectivitystatus") >= 0 || w.indexOf("hardwarestatus") >= 0 || w.indexOf("twobarsbelowhero") >= 0) direct = spmFirst(".status-bar") || spmFirst(".cam-health-strip");
        else if (/^(sensors|livesensors|sensorsection|sensorsataglance|live)$/.test(w) || w.indexOf("livesensor") >= 0 || w.indexOf("sensorsataglance") >= 0) direct = spmFirst(".bento") || spmByText(".section-title,.section-heading,h1,h2,h3", [/live sensors/,/sensors at a glance/,/sensor/], ".dash-section,.sensor-cam-grid,section,.glass");
        else if (w.indexOf("pumphistory") >= 0 || w.indexOf("wateringhistory") >= 0 || w.indexOf("waterhistory") >= 0) direct = spmFirst(".pump-history-section") || spmByText(".section-title,.section-heading,h1,h2,h3,.chart-title", [/pump history/,/watering history/,/water history/], ".pump-history-section,.table-wrapper,.glass,section");
        else if (/^(history|readingshistory|sensorhistory|datatable|records)$/.test(w)) direct = spmFirst(".history-section") || spmByText(".section-title,.section-heading,h1,h2,h3", [/sensor history/,/readings history/,/^history$/], ".history-section,.table-wrapper,.glass,section");
        else if (w.indexOf("pump") >= 0 || w.indexOf("waternow") >= 0 || w.indexOf("autowater") >= 0 || w.indexOf("wateringcontrol") >= 0) direct = spmFirst(".pump-card") || spmByText(".pump-title,.section-title,.section-heading,h1,h2,h3", [/water pump/,/pump/], ".pump-card,.glass,section");
        else if (/^(camera|livecamera|liveview|cameramodule)$/.test(w)) direct = spmFirst(".cam-card") || spmByText(".cam-card-title,.section-title,.section-heading,h1,h2,h3", [/camera module/,/live view/,/camera/], ".cam-card,.glass,section");
        else if (/^(trends|charts|graphs)$/.test(w)) direct = spmFirst(".charts-section") || spmByText(".section-heading,.chart-title,h1,h2,h3", [/trend/,/chart/,/graph/], ".charts-section,.chart-box,.glass,section");
        else if (/soil/.test(w)) direct = spmByText(".bento-label,.chart-title,.section-title", [/soil/], ".bento-card,.chart-box,.glass");
        else if (/waterlevel|tank/.test(w)) direct = spmByText(".bento-label,.chart-title,.section-title", [/water level/,/tank/], ".bento-card,.chart-box,.glass");
        else if (/temp/.test(w)) direct = spmByText(".bento-label,.chart-title,.section-title", [/temperature/,/temp/], ".bento-card,.chart-box,.glass");
        else if (/humid/.test(w)) direct = spmByText(".bento-label,.chart-title,.section-title", [/humidity/,/humid/], ".bento-card,.chart-box,.glass");
        else if (/light|lux/.test(w)) direct = spmByText(".bento-label,.chart-title,.section-title", [/light/,/lux/], ".bento-card,.chart-box,.glass");
        else if (/battery|power/.test(w)) direct = spmByText(".bento-label,.chart-title,.section-title", [/battery/,/power/], ".bento-card,.chart-box,.glass");
        if (direct) return direct;
        return spmByText(".section-title,.section-heading,.bento-label,.pump-title,.cam-card-title,.chart-title,h1,h2,h3", [new RegExp(which.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i")], ".bento-card,.pump-card,.cam-card,.chart-box,.glass,section");
      }
      // -- overlay coordination so two popups can never stack --------------
      function spmCameraOpen() {
        return !!document.querySelector(".cam-overlay.open, .cam-panel.open");
      }
      function spmCloseCamera() {
        // Click the panel's own close control so React updates its open state.
        // Both the ✕ button and the backdrop are wired to closePanel.
        var btn = document.querySelector(".cam-close-btn");
        if (btn) { try { btn.click(); return true; } catch (e) {} }
        var ov = document.querySelector(".cam-overlay.open");
        if (ov) { try { ov.click(); return true; } catch (e) {} }
        return false;
      }
      function spmJournalOpen() {
        // The journal modal is position:fixed, so offsetParent is ALWAYS null and
        // must not be used to test visibility. closeModal() removes the node from
        // the DOM, so its mere presence means the viewer is open.
        return !!document.getElementById("spm-journal-modal");
      }
      function spmCloseJournal() {
        if (window.__SPM_JOURNAL__ && window.__SPM_JOURNAL__.close) {
          try { window.__SPM_JOURNAL__.close(); return true; } catch (e) {}
        }
        return false;
      }
      // Dismiss any popup that would overlap what we're about to show.
      // keep = "journal" | "camera" | null (null closes everything).
      function spmCloseConflicts(keep) {
        var closed = false;
        if (keep !== "camera" && spmCameraOpen()) { spmCloseCamera(); closed = true; }
        if (keep !== "journal" && spmJournalOpen()) { spmCloseJournal(); closed = true; }
        return closed;
      }
      function spmIntentFromQuestion(q) {
        var x = String(q || "").toLowerCase();
        var nav = /\b(show|take|bring|go|scroll|open|view|find|where|close|exit|back|redirect)\b/.test(x);
        if (!nav) return null;
        var photo = /\b(photo|photos|picture|image|journal|gallery|mug|tea|pack|package)\b/.test(x);
        if (/\b(close|exit|dismiss|hide)\b/.test(x) && /\b(popup|journal|camera|view)\b/.test(x)) return { type:"close_overlays" };
        if (/\b(camera|live feed|live view)\b/.test(x)) return { type:"open_camera" };
        if (photo && /\b(photo|photos|picture|image|journal|gallery|mug|tea|pack|package)\b/.test(x)) return { type:"photo_request" };
        var sec = null;
        if (/\b(hero|topmost|top of (the )?dashboard|dashboard top|main dashboard)\b/.test(x)) sec = "hero";
        else if (/esp32.?s3.?cam.*status|camera status|device status|status bars?|connectivity status|hardware status|two bars? below (the )?hero/.test(x)) sec = "device_status";
        else if (/pump history|watering history|water history/.test(x)) sec = "pump_history";
        else if (/\b(water pump|pump button|pump control|auto.?water|on and off|on\/off)\b/.test(x)) sec = "pump";
        else if (/plant intelligence|machine learning|\bml\b|prediction|forecast/.test(x)) sec = "intelligence";
        else if (/growth journal|journal section|photo gallery/.test(x)) sec = "journal";
        else if (/live sensor|sensors at a glance|sensor section/.test(x)) sec = "sensors";
        else if (/sensor history|readings history|history table/.test(x)) sec = "history";
        else if (/trend|chart|graph/.test(x)) sec = "trends";
        return sec ? { type:"focus_section", section:sec } : null;
      }
      function runUiAction(a) {
        if (!a || typeof a !== "object") return;
        var type = a.type || a.action;
        try {
          if (type === "show_journal_photo") {
            var hadPopupJ = spmCloseConflicts("journal");
            var openJ = function () {
              if (window.__SPM_JOURNAL__ && window.__SPM_JOURNAL__.openToPhoto) window.__SPM_JOURNAL__.openToPhoto(a.date, a.slot, a.key, a.index);
              else spmScrollHighlight(document.getElementById("spm-journal-photos"));
              setTimeout(function () { setCollapsed(true); }, 850);
            };
            // Let a closing camera overlay tear down first so they never coexist.
            if (hadPopupJ) setTimeout(openJ, 120); else openJ();
          } else if (type === "open_journal") {
            var hadPopupO = spmCloseConflicts("journal");
            var openO = function () {
              if (window.__SPM_JOURNAL__ && window.__SPM_JOURNAL__.open) window.__SPM_JOURNAL__.open();
              setTimeout(function () { setCollapsed(true); }, 850);
            };
            if (hadPopupO) setTimeout(openO, 120); else openO();
          } else if (type === "open_camera") {
            var hadPopupC = spmCloseConflicts("camera");
            if (spmCameraOpen()) {
              // Already showing the camera — just tuck the chat away; do NOT
              // click again or it would toggle the popup shut.
              setTimeout(function () { setCollapsed(true); }, 300);
            } else {
              var openC = function () {
                var cam = document.querySelector(".cam-card:not(.cam-disabled)");
                if (cam) { try { cam.click(); } catch (e) {} setTimeout(function () { setCollapsed(true); }, 500); }
                else spmScrollHighlight(spmFindSection("camera"));
              };
              // Wait for the journal overlay to close before opening the camera.
              if (hadPopupC) setTimeout(openC, 120); else openC();
            }
          } else if (type === "focus_section") {
            // Scrolling the page underneath only makes sense with popups closed.
            var hadPopupF = spmCloseConflicts(null);
            var target = spmFindSection(a.section || a.target);
            setTimeout(function () { spmScrollHighlight(target); }, hadPopupF ? 150 : 0);
            setTimeout(function () { setCollapsed(true); }, 850);
          } else if (type === "minimize_chat") {
            setCollapsed(true);
          } else if (type === "close_overlays" || type === "close") {
            spmCloseConflicts(null);
          }
        } catch (e) { try { console.error("[spm-ask] ui_action failed", e); } catch (e2) {} }
      }

      // --- WebSocket streaming for /ask (additive; HTTP fetch stays as fallback) ---
      var ASK_WS_URL = (window.__SPM_ASK_WS__ || "wss://fbtd8vs7p1.execute-api.ap-southeast-1.amazonaws.com/production");
      function finishAsk(pendingMsg, result) {
        var idx = history.indexOf(pendingMsg);
        if (result && result.answer) {
          if (idx !== -1) history[idx] = { role: "assistant", text: result.answer, sources: Array.isArray(result.sources) ? result.sources.slice(0, 8) : [] };
        } else {
          var msg = (result && result.error) || "Sorry, something went wrong.";
          if (idx !== -1) history[idx] = { role: "error", text: msg };
        }
        busy = false; sendBtn.disabled = false; sendBtn.textContent = "Ask";
        saveLog(); renderHistory();
        var li = result && result.localIntent;
        if (result && result.ui_action) { runUiAction(result.ui_action); }
        else if (li && li.type !== "photo_request") { runUiAction(li); }
      }
      function askHttp(q, pendingMsg, localIntent) {
        fetch(API + "/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q.slice(0, MAXLEN), session_id: sid, web_search: webOn })
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }, function () { return { ok: r.ok, j: {} }; }); })
          .then(function (res) {
            if (res.ok && res.j && res.j.answer) finishAsk(pendingMsg, { answer: res.j.answer, ui_action: res.j.ui_action, sources: res.j.sources, localIntent: localIntent });
            else finishAsk(pendingMsg, { error: (res.j && (res.j.error || res.j.message)) || "Sorry, something went wrong.", localIntent: localIntent });
          })
          .catch(function () { finishAsk(pendingMsg, { error: "Could not reach the assistant. Check your connection.", localIntent: localIntent }); });
      }
      function streamAsk(q, pendingMsg, localIntent) {
        var ws, settled = false, acc = "", timer = null;
        var rid = "r" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
        function fallback() { if (settled) return; settled = true; try { if (ws) ws.close(); } catch (e) {} askHttp(q, pendingMsg, localIntent); }
        try { ws = new WebSocket(ASK_WS_URL); } catch (e) { fallback(); return; }
        timer = setTimeout(function () { if (!acc && !settled) fallback(); }, 8000);
        ws.onopen = function () { try { ws.send(JSON.stringify({ action: "ask", question: q.slice(0, MAXLEN), session_id: sid, request_id: rid, web_search: webOn })); } catch (e) { fallback(); } };
        ws.onerror = function () { fallback(); };
        ws.onclose = function () { if (!settled && !acc) fallback(); };
        ws.onmessage = function (ev) {
          var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (!m || (m.request_id && m.request_id !== rid)) return;
          if (m.type === "ask_chunk") {
            if (timer) { clearTimeout(timer); timer = null; }
            acc += (m.text || "");
            pendingMsg.text = acc; pendingMsg.pending = true;
            renderHistory();
          } else if (m.type === "ask_done") {
            if (settled) return; settled = true;
            if (timer) { clearTimeout(timer); timer = null; }
            try { ws.close(); } catch (e) {}
            finishAsk(pendingMsg, { answer: (m.answer || acc || ""), ui_action: m.ui_action, sources: m.sources, localIntent: localIntent });
          } else if (m.type === "ask_error") {
            if (settled) return;
            if (timer) { clearTimeout(timer); timer = null; }
            if (acc) { settled = true; try { ws.close(); } catch (e) {} finishAsk(pendingMsg, { answer: acc, localIntent: localIntent }); }
            else { fallback(); }
          }
        };
      }
      var busy = false;
      function ask() {
        if (busy) return;
        var q = (inp.value || "").trim();
        if (!q) { inp.focus(); return; }
        var localIntent = spmIntentFromQuestion(q);
        // Keep the current popup visible while the LLM is thinking. Conflicting
        // views are closed only inside runUiAction, after a destination is known.
        busy = true; sendBtn.disabled = true; sendBtn.textContent = "...";
        var pendingAction = null;

        history.push({ role: "user", text: q });
        var pendingMsg = { role: "assistant", text: "Thinking...", pending: true };
        history.push(pendingMsg);
        renderHistory();
        saveLog();
        inp.value = "";
        inp.style.height = "40px";

        streamAsk(q, pendingMsg, localIntent);
      }
      sendBtn.addEventListener("click", function (e) { e.stopPropagation(); ask(); });
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
      });

      console.log("[spm-ask] mounted");
    }

    function ensure() {
      try {
        if (document.getElementById(HOSTID)) return;
        build();
      } catch (err) {
        try { console.error("[spm-ask] build failed:", err); } catch (e2) {}
      }
    }

    function start() {
      ensure();
      var n = 0;
      var t = setInterval(function () {
        ensure();
        if (document.getElementById(HOSTID) || ++n > 80) clearInterval(t);
      }, 250);
    }

    if (document.body) {
      start();
    } else {
      document.addEventListener("DOMContentLoaded", start);
    }
  } catch (outerErr) {
    try { console.error("[spm-ask] fatal:", outerErr); } catch (e3) {}
  }
})();
</script>
